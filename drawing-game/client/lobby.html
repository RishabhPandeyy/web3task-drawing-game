<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Room | Quickdraw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/lobby.js" defer></script>
</head>
<body class="lobby-page">
  <header class="site-header lobby-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">qd</span><span>quickdraw<span class="brand-period">.</span></span></a><a class="back-link" href="/">← Leave room</a></header>
  <main class="lobby-layout">
    <section class="lobby-intro"><p class="eyebrow"><span class="eyebrow-line"></span> YOUR GAME IS ALMOST ON</p><h1>Bring your<br><span class="headline-accent">best guesses.</span></h1><p>Send the code around. The more questionable the drawing, the better.</p></section>
    <section class="room-panel">
      <div class="room-code-block"><div><p class="eyebrow">ROOM CODE</p><strong id="room-code-display">-----</strong></div><button id="copy-code" class="icon-button copy-button" type="button" aria-label="Copy room code" title="Copy room code">▣</button></div>
      <div class="player-heading"><h2>Players <span id="player-count" class="count-pill">0</span></h2><span id="capacity-label" class="capacity-label">UP TO 8</span></div>
      <div id="settings-summary" class="settings-summary"></div>
      <ul id="player-list" class="player-list" aria-live="polite"></ul>
      <p id="lobby-error" class="form-error" role="alert" aria-live="polite"></p>
      <button id="start-game" class="button button-primary button-full" type="button" disabled><span>Start the game</span><span aria-hidden="true">↗</span></button>
      <p id="waiting-message" class="waiting-message">Waiting for at least one more player<span class="loading-dots">...</span></p>
    </section>
  </main>
  <footer class="site-footer"><span>QUICKDRAW / ROOM <b id="footer-code">-----</b></span><span>SHARE THE CODE. CLAIM NO ARTISTIC SKILL.</span></footer>
</body>
</html>
